<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <!-- DK Electronics Official Brand Logo (For Light Backgrounds) -->
  <defs>
    <style>
      .dk-text { font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif; font-weight: 900; }
      .elec-pill { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; }
      .sub-text { font-family: 'Inter', -apple-system, sans-serif; font-weight: 800; letter-spacing: 0.18em; }
    </style>
  </defs>

  <!-- 1. Authentic Eagle Wings Emblem (Dark variant) -->
  <g transform="translate(-15, 2) scale(0.95)">
    <!-- Left Multi-Feather Wing -->
    <path d="M 60,32 C 50,30 36,22 8,14 C 18,22 30,28 44,34 C 32,32 18,28 4,24 C 14,32 26,38 42,42 C 28,40 18,38 8,36 C 20,44 34,48 56,48 Z" fill="#111111"/>
    <path d="M 58,26 C 46,24 30,16 12,6 C 24,14 38,20 54,24 Z" fill="#111111" opacity="0.85"/>
    
    <!-- Right Multi-Feather Wing -->
    <path d="M 80,32 C 90,30 104,22 132,14 C 122,22 110,28 96,34 C 108,32 122,28 136,24 C 126,32 114,38 98,42 C 112,40 122,38 132,36 C 120,44 106,48 84,48 Z" fill="#111111"/>
    <path d="M 82,26 C 94,24 110,16 128,6 C 116,14 102,20 86,24 Z" fill="#111111" opacity="0.85"/>
    
    <!-- Central Geometric Shield with Monogram DK -->
    <polygon points="70,12 80,24 80,38 70,50 60,38 60,24" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
    <polygon points="70,16 76,24 76,36 70,44 64,36 64,24" fill="#111111"/>
    <text x="70" y="33" class="dk-text" font-size="12" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">DK</text>
    
    <!-- Sub-label beneath wings -->
    <text x="70" y="58" class="sub-text" font-size="6.5" fill="#4B5563" text-anchor="middle">DK ELECTRONICS</text>
  </g>

  <!-- Divider Line -->
  <line x1="126" y1="20" x2="126" y2="60" stroke="#111111" stroke-opacity="0.2" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 2. Main Wordmark: Bold Dark "DK" + Signature Red Rounded "Electronics" Signage -->
  <g transform="translate(142, 16)">
    <!-- Bold Black DK -->
    <text x="0" y="34" class="dk-text" font-size="34" fill="#111111" letter-spacing="-0.03em">DK</text>
    
    <!-- Red Rounded Capsule / Pill "Electronics" Signage -->
    <g transform="translate(58, 12)">
      <rect x="0" y="0" width="102" height="26" rx="13" fill="#D82935"/>
      <text x="51" y="17.5" class="elec-pill" font-size="12" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">Electronics</text>
    </g>
  </g>
</svg>
